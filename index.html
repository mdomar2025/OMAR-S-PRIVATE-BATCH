<style>body{font-family:'Hind Siliguri',sans-serif;background:linear-gradient(145deg,#f4fbff,#eefaf4 48%,#e9f3ff) fixed;color:#12345a;min-height:100vh}
.g{background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border:1px solid rgba(59,130,246,.13);border-radius:18px;color:#12345a}.gold{color:#1769c2}
.btn{background:linear-gradient(135deg,#2563eb,#16a085);color:white;font-weight:700;border-radius:12px;padding:.6rem 1rem}
textarea{background:#fff;border:1px solid #d8e7f5;border-radius:10px;padding:.55rem .8rem;color:#12345a;width:100%;caret-color:#f5c542}::placeholder{color:rgba(18,52,90,.45)}
select{background:#fff;border:1px solid #d8e7f5;border-radius:10px;padding:.6rem .8rem;color:#12345a;width:100%}
input{background:#fff;border:1px solid #d8e7f5;border-radius:10px;padding:.55rem .8rem;color:#12345a;width:100%}
.fade{animation:f .5s}@keyframes f{from{opacity:0;transform:translateY(8px)}}
.tab{padding:.5rem .9rem;border-radius:10px;font-weight:600}.on{background:linear-gradient(120deg,#dbeafe,#d1fae5);color:#164b83;border:1px solid #93c5fd}*{-webkit-tap-highlight-color:transparent}body{padding-bottom:env(safe-area-inset-bottom)}
.g{box-shadow:0 8px 26px rgba(30,64,175,.06)} .tab.g{color:#28619c} .text-blue-200,.text-blue-300{color:#4b78a6!important}button{transition:transform .1s,opacity .2s}button:active{transform:scale(.97)}input,select{font-size:16px}.btn:disabled{opacity:.6}

function Login({done}){const[adm,setAdm]=useState(false),[names,setNames]=useState([]),[namesReady,setNamesReady]=useState(false),[namesError,setNamesError]=useState(''),[id,setId]=useState(''),[pin,setPin]=useState(''),[phone,setPhone]=useState(''),[err,setErr]=useState(''),[busy,setBusy]=useState(false);
useEffect(()=>{(async()=>{try{const{data,error}=await sb.rpc('student_names');if(error){setNamesError(error.message);setNames([])}else{setNames(data||[])} }catch(x){setNamesError(x.message)}finally{setNamesReady(true)}})()},[]);
const norm=x=>String(x||'').trim().toLowerCase().replace(/\s+/g,' ');
const find=q=>{const n=norm(q);const m=names.find(x=>norm(x.name)===n);return m?m.student_code:null};
const go=async e=>{e.preventDefault();const q=id.trim();if(!q)return setErr(adm?'ইমেইল লিখুন':'আপনার নাম লিখুন');if(!adm&&!namesReady)return setErr('শিক্ষার্থীদের তালিকা লোড হচ্ছে। কয়েক সেকেন্ড পরে আবার চেষ্টা করুন।');if(!adm&&namesError)return setErr('শিক্ষার্থীদের তালিকা পাওয়া যায়নি: '+namesError+'। Supabase-এর student_names Function পরীক্ষা করতে হবে।');setBusy(true);setErr('');
try{let key=adm?q:find(q);

<h1 class="text-3xl font-bold gold mt-5">OMAR’S PRIVATE BATCH</h1><p class="mt-2 text-blue-200">90 Days Math Challenge ও আরও চ্যালেঞ্জ</p>
<form onSubmit=${go} class="g p-5 mt-6 text-left space-y-3"><div class="font-semibold">${adm?'অ্যাডমিন লগইন':'লগইন'}</div>
<input placeholder=${adm?'অ্যাডমিন ইমেইল':'আপনার নাম লিখুন'} value=${id} onInput=${e=>setId(e.target.value)}/>
<input type="password" placeholder=${adm?'পাসওয়ার্ড':'পিন'} value=${pin} onInput=${e=>setPin(e.target.value)} required/>
${!adm&&html`<input type="tel" inputMode="numeric" placeholder="মোবাইল / WhatsApp নম্বর (প্রথমবার)" value=${phone} onInput=${e=>setPhone(e.target.value)}/><div class="text-xs text-blue-200">প্রথমবার অ্যাকাউন্ট খোলার সময় নম্বর দিন; এই নম্বরে WhatsApp যোগাযোগ করা যাবে।</div>`}
${err&&html`<div class="text-red-400 text-sm break-words">${err}</div>`}
<button class="btn w-full" disabled=${busy||(!adm&&!namesReady)}>${busy?'অপেক্ষা করুন...':(!adm&&!namesReady?'তালিকা লোড হচ্ছে...':'প্রবেশ করুন')}</button>
${!adm&&html`<div class="text-xs text-blue-200 text-center">প্রথমবার নাম ও পিন দিলেই আপনার অ্যাকাউন্ট খুলে যাবে</div>`}
<button type="button" class="text-xs underline text-blue-200 w-full" onClick=${()=>{setAdm(!adm);setId('');setErr('')}}>${adm?'শিক্ষার্থী লগইন':'অ্যাডমিন লগইন'}</button></form></div>`}
function Admin(){const[tab,setTab]=useState('ch'),[chs,setChs]=useState([]),[arch,setArch]=useState([]),[st,setSt]=useState([]),[open,setOpen]=useState(null),[f,setF]=useState({name:'',all:true});
const loadS=async()=>{const{data}=await sb.from('profiles').select('*').eq('role','student').order('created_at');setSt(data||[])};
const loadC=async()=>{const{data,error}=await sb.from('challenges').select('*').eq('is_deleted',false).order('created_at');if(error){alert('চ্যালেঞ্জ লোড হয়নি: '+error.message);return}setChs(data||[])};
const loadArch=async()=>{const{data,error}=await sb.from('challenges').select('*').eq('is_deleted',true).order('created_at',{ascending:false});if(error){alert('আর্কাইভ লোড হয়নি: '+error.message);return}setArch(data||[])};
useEffect(()=>{loadS();loadC();loadArch()},[]);
const archiveChallenge=async c=>{if(!confirm('“'+c.name+'” চ্যালেঞ্জটি আর্কাইভ করবেন? ক্লাস সম্পন্নের তথ্য ও পরীক্ষার নম্বর ও অন্যান্য রেকর্ড মুছবে না। পরে ফিরিয়ে আনা যাবে।'))return;const{error}=await sb.from('challenges').update({is_deleted:true}).eq('id',c.id);if(error){alert('আর্কাইভ করা যায়নি: '+error.message);return}await loadC();await loadArch();alert('চ্যালেঞ্জটি আর্কাইভ হয়েছে। পুরোনো রেকর্ড নিরাপদ আছে।')};
const renameChallenge=async c=>{const n=prompt('চ্যালেঞ্জের নতুন নাম লিখুন',c.name);if(n===null||!n.trim())return;const{error}=await sb.from('challenges').update({name:n.trim()}).eq('id',c.id);if(error)return alert('নাম পরিবর্তন হয়নি: '+error.message);await loadC();alert('চ্যালেঞ্জের নাম পরিবর্তন হয়েছে ✓')};
const restoreChallenge=async c=>{if(!confirm('“'+c.name+'” চ্যালেঞ্জটি আবার চালু করবেন?'))return;const{error}=await sb.from('challenges').update({is_deleted:false}).eq('id',c.id);if(error){alert('ফিরিয়ে আনা যায়নি: '+error.message);return}await loadC();await loadArch();alert('চ্যালেঞ্জটি ফিরিয়ে আনা হয়েছে ✓')};
const deleteChallenge=async c=>{if(!confirm('“'+c.name+'” চ্যালেঞ্জ এবং এর সব ক্লাস সম্পন্নের তথ্য ও পরীক্ষার নম্বর চিরতরে মুছে যাবে। এটা ফেরানো যাবে না। মুছবেন?'))return;if(!confirm('শেষবার নিশ্চিত করুন: সত্যিই মুছে ফেলবেন?'))return;const{error}=await sb.from('challenges').delete().eq('id',c.id);if(error)return alert('মোছা যায়নি: '+error.message);loadC();loadArch()};
const create=async()=>{const name=f.name.trim();if(!name)return alert('চ্যালেঞ্জের নাম লিখুন');try{const{error}=await sb.from('challenges').insert({name,all_students:f.all});if(error){alert('চ্যালেঞ্জ তৈরি হয়নি: '+error.message);return}setF({name:'',all:true});await loadC();alert('চ্যালেঞ্জ সফলভাবে তৈরি হয়েছে ✓')}catch(e){alert('চ্যালেঞ্জ তৈরি করতে সমস্যা হয়েছে: '+(e?.message||e))}};
if(open)return html`<div><button class="underline text-sm mb-3" onClick=${()=>setOpen(null)}>← সব চ্যালেঞ্জ</button><${Chal} ch=${open} st=${st}/></div>`;
const T=(k,l)=>html`<button class=${'tab '+(tab===k?'on':'g')} onClick=${()=>setTab(k)}>${l}</button>`;
return html`<div><div class="flex gap-2 mb-4 flex-wrap">${T('ch','চ্যালেঞ্জ')}${T('stu','শিক্ষার্থী')}</div>
${tab==='ch'&&html`<div class="space-y-3"><div class="g p-3 space-y-2"><div class="font-semibold">নতুন চ্যালেঞ্জ</div>
<input placeholder="চ্যালেঞ্জের নাম" value=${f.name} onInput=${e=>setF({...f,name:e.target.value})}/>
<label class="flex items-center gap-2"><input type="checkbox" class="!w-5 !h-5 accent-yellow-400" checked=${f.all} onChange=${e=>setF({...f,all:e.target.checked})}/>সব শিক্ষার্থীর জন্য</label>
<button class="btn w-full" onClick=${create}>চ্যালেঞ্জ তৈরি করুন</button></div>
${chs.map(c=>html`<div key=${c.id} class="g p-3 flex items-center gap-2 flex-wrap"><button onClick=${()=>setOpen(c)} class="flex-1 text-left font-semibold gold min-w-0">${c.name}<div class="text-xs text-blue-200 font-normal">${c.all_students?'সব শিক্ষার্থী':'বাছাই করা শিক্ষার্থী'}</div></button><button class="text-blue-200 border border-blue-300/40 rounded-lg px-3 py-2 text-sm" onClick=${()=>renameChallenge(c)}>নাম এডিট</button><button class="text-red-300 border border-red-400/40 rounded-lg px-3 py-2 text-sm" onClick=${()=>deleteChallenge(c)}>মুছুন</button></div>`)}</div>`}
${tab==='arch'&&html`<div class="space-y-3"><div class="text-sm text-blue-200">এখানকার চ্যালেঞ্জগুলো শিক্ষার্থীদের তালিকায় দেখা যায় না। পুরোনো হাজিরা ও পরীক্ষার তথ্য অক্ষত আছে।</div>${arch.length===0&&html`<div class="g p-4 text-center">আর্কাইভে কোনো চ্যালেঞ্জ নেই</div>`}${arch.map(c=>html`<div key=${c.id} class="g p-3 flex items-center gap-2"><div class="flex-1 font-semibold gold">${c.name}</div><button class="btn text-sm" onClick=${()=>restoreChallenge(c)}>ফিরিয়ে আনুন</button><button class="text-red-300 border border-red-400/40 rounded-lg px-3 py-2 text-sm" onClick=${()=>deleteChallenge(c)}>চিরতরে মুছুন</button></div>`)}</div>`}
${tab==='stu'&&html`<${Students} st=${st} reload=${loadS}/>`}</div>`}

function Chal({ch,st}){const[tab,setTab]=useState('classes'),[dl,setDl]=useState([]),[date,setDate]=useState(today()),[pres,setPres]=useState(new Set()),[days,setDays]=useState(0),[ex,setEx]=useState([]),[lb,setLb]=useState([]),[mem,setMem]=useState(new Set()),[classList,setClassList]=useState([]),[comps,setComps]=useState({}),[cf,setCf]=useState({title:'',url:'',date:today(),xp:10,lim:24}),[saving,setSaving]=useState(false),[L,setL]=useState({});
const loadA=async()=>{const{data}=await sb.from('attendance').select('student_id').eq('day',date).eq('challenge_id',ch.id);setPres(new Set((data||[]).map(r=>r.student_id)))};

function GuideAdmin(){const[g,setG]=useState(null),[f,setF]=useState({title:'',url:'',note:''}),[busy,setBusy]=useState(false);
const load=async()=>{try{const r=await sb.from('app_settings').select('value').eq('key','guidelines').maybeSingle();setG(Array.isArray(r.data&&r.data.value)?r.data.value:[])}catch(e){setG([])}};
useEffect(()=>{load()},[]);
const save=async arr=>{const{error}=await sb.from('app_settings').upsert({key:'guidelines',value:arr,updated_at:new Date().toISOString()});if(error){alert('সেভ হয়নি: '+error.message);return false}setG(arr);return true};
const add=async()=>{if(!f.title.trim())return alert('গাইডলাইনের নাম লিখুন');if(!/^https?:\/\//i.test(f.url.trim()))return alert('ভিডিওর লিংক দিন (https:// দিয়ে শুরু)');setBusy(true);const item={id:String(Date.now()),title:f.title.trim(),url:f.url.trim(),note:f.note.trim(),at:new Date().toISOString()};const ok=await save([item,...(g||[])]);setBusy(false);if(ok){setF({title:'',url:'',note:''});alert('গাইডলাইন প্রকাশ হয়েছে ✓ শিক্ষার্থীরা “গাইডলাইন” ট্যাবে দেখতে পাবে')}};
const del=async x=>{if(!confirm('“'+x.title+'” মুছবেন?'))return;await save((g||[]).filter(y=>y.id!==x.id))};
return html`<div class="space-y-3"><div class="text-lg font-bold text-center">📖 গাইডলাইন</div>

${g===null&&html`<div class="text-center p-4">লোড হচ্ছে...</div>`}${g&&g.length===0&&html`<div class="g p-4 text-center">এখনো কোনো গাইডলাইন দেওয়া হয়নি</div>`}
${(g||[]).map(x=>html`<div key=${x.id} class="g p-3 space-y-2"><div class="font-bold">${x.title}</div>${x.note&&html`<div class="text-sm" style=${{whiteSpace:'pre-wrap'}}>${x.note}</div>`}<div class="text-xs text-blue-300">${new Date(x.at).toLocaleString('bn-BD',{timeZone:'Asia/Dhaka'})}</div><div class="flex gap-2"><a class="btn flex-1 text-center" href=${x.url} target="_blank" rel="noopener">▶ দেখুন</a><button type="button" class="tab g text-red-500" onClick=${()=>del(x)}>মুছুন</button></div></div>`)}</div>`}

function Exams({act,ex,reload,cid}){const[f,setF]=useState({name:'',date:today(),total:20}),[sel,setSel]=useState(null),[m,setM]=useState({});
const open=async e=>{setSel(e);const{data}=await sb.from('marks').select('*').eq('exam_id',e.id);const o={};(data||[]).forEach(r=>o[r.student_id]=r.marks);setM(o)};
const create=async()=>{if(!f.name.trim())return alert('পরীক্ষার নাম লিখুন');
const{data,error}=await sb.from('exams').insert({challenge_id:cid,name:f.name.trim(),exam_date:f.date,total:+f.total}).select().single();
if(error)return alert(error.message);setF({...f,name:''});await reload();open(data)};
const save=async()=>{const rows=Object.entries(m).filter(([,v])=>v!==''&&v!=null).map(([id,v])=>({exam_id:sel.id,student_id:id,marks:+v}));
if(rows.some(r=>r.marks>sel.total||r.marks<0))return alert('নম্বর সঠিক নয়');
const{error}=await sb.from('marks').upsert(rows);alert(error?error.message:'সংরক্ষিত হয়েছে ✓');reload()};
const rank=act.filter(s=>m[s.id]!==undefined&&m[s.id]!=='').sort((a,b)=>m[b.id]-m[a.id]);const ann=async()=>{const{error}=await sb.from('announcements').insert({title:'📝 পরীক্ষা: '+sel.name,body:'তারিখ: '+sel.exam_date+' · মোট নম্বর: '+sel.total});alert(error?error.message:'পরীক্ষার ঘোষণা দেওয়া হয়েছে ✓')};
const pub=async()=>{if(!rank.length)return alert('আগে নম্বর দিয়ে সংরক্ষণ করুন');if(!confirm('রেজাল্ট শিক্ষার্থীদের ঘোষণায় প্রকাশ করবেন?'))return;const body=rank.map((s,i)=>(i+1)+'. '+s.name+' — '+m[s.id]+'/'+sel.total).join('\n');const{error}=await sb.from('announcements').insert({title:'🏆 ফলাফল: '+sel.name,body});alert(error?error.message:'রেজাল্ট প্রকাশিত ✓')};
const exportPdf=()=>{const w=window.open('','_blank');if(!w)return alert('পপআপ অনুমতি দিন');const rows=rank.map((s,i)=>'<tr><td>'+ (i+1) +'</td><td>'+esc(s.name)+'</td><td>'+m[s.id]+'/'+sel.total+'</td></tr>').join('');w.document.write('<html><head><meta charset="utf-8"><title>Exam Results</title><style>body{font-family:Arial,sans-serif;padding:24px;color:#12345a}h1,h2{text-align:center}table{width:100%;border-collapse:collapse}th,td{border:1px solid #aac4dd;padding:8px;text-align:center}th:first-child,td:first-child{text-align:left}</style></head><body><h1>ওমর স্যার · OMAR’S PRIVATE BATCH</h1><h2>'+esc(sel.name)+' · ফলাফল</h2><p>তারিখ: '+esc(sel.exam_date)+' · পূর্ণমান: '+sel.total+'</p><table><thead><tr><th>র‍্যাংক</th><th>শিক্ষার্থী</th><th>নম্বর</th></tr></thead><tbody>'+rows+'</tbody></table><script>window.onload=()=>window.print()<\/script></body></html>');w.document.close()};
return html`<div class="space-y-3"><div class="g p-3 space-y-2"><div class="font-semibold">বাইরে নেওয়া পরীক্ষার ফল যোগ করুন</div>
<input placeholder="পরীক্ষার নাম" value=${f.name} onInput=${e=>setF({...f,name:e.target.value})}/>
<div class="flex gap-2"><input type="date" value=${f.date} onInput=${e=>setF({...f,date:e.target.value})}/><input type="number" placeholder="মোট নম্বর" value=${f.total} onInput=${e=>setF({...f,total:e.target.value})}/></div>
<button class="btn w-full" onClick=${create}>পরীক্ষা তৈরি করুন</button></div>
<div class="flex gap-2 overflow-x-auto">${ex.map(e=>html`<button key=${e.id} onClick=${()=>open(e)} class=${'tab whitespace-nowrap '+(sel&&sel.id===e.id?'on':'g')}>${e.name}</button>`)}</div>
${sel&&html`<div class="g p-3 space-y-2"><div class="font-semibold gold">${sel.name} — মোট ${sel.total}</div>
${act.map(s=>html`<div key=${s.id} class="flex items-center justify-between gap-3"><span>${s.name}</span><input class="!w-24" type="number" step="0.5" value=${m[s.id]??''} onInput=${e=>setM({...m,[s.id]:e.target.value})}/></div>`)}
<button class="btn w-full" onClick=${save}>নম্বর সংরক্ষণ</button><button class="tab g w-full" disabled=${rank.length===0} onClick=${exportPdf}>PDF / প্রিন্ট রেজাল্ট</button><div class="grid grid-cols-2 gap-2"><button class="tab g border border-blue-300 text-sm" onClick=${ann}>📢 পরীক্ষার ঘোষণা</button><button class="tab g border border-green-300 text-sm" onClick=${pub}>🏆 রেজাল্ট প্রকাশ</button></div>

function Students({st,reload}){const[name,setName]=useState(''),[phone,setPhone]=useState(''),[upin,setUpin]=useState(''),[cur,setCur]=useState(null),[busy,setBusy]=useState(false),[q,setQ]=useState(''),[view,setView]=useState('active');
const loadP=async()=>{const{data}=await sb.from('settings').select('value').eq('key','pin').maybeSingle();setCur(data?data.value:'')};
useEffect(()=>{loadP()},[]);
const setPin=async()=>{if(upin.length<6)return alert('পিন কমপক্ষে ৬ অক্ষরের হতে হবে');const{error}=await sb.rpc('set_universal_pin',{p:upin});if(error)return alert(error.message);setUpin('');alert('পিন সেট হয়েছে ✓');loadP()};
const add=async()=>{const n=name.trim();if(!n)return alert('শিক্ষার্থীর নাম লিখুন');if(!/^01[3-9]\d{8}$/.test(phone.replace(/[\s-]/g,'')))return alert('সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন');if(!cur)return alert('আগে ইউনিভার্সাল পিন সেট করুন');const mx=Math.max(0,...st.map(s=>parseInt((s.student_code||'').replace(/\D/g,''))||0));const code='opb'+String(mx+1).padStart(2,'0');setBusy(true);const tmp=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const{error}=await tmp.auth.signUp({email:toEmail(code),password:cur,options:{data:{name:n,student_code:code,phone_number:phone.replace(/[\s-]/g,'')}}});setBusy(false);if(error)return alert(error.message);setName('');setPhone('');reload()};
const rename=async s=>{const n=prompt('নতুন নাম',s.name);if(n===null||!n.trim())return;const ph=prompt('মোবাইল / WhatsApp নম্বর (০১XXXXXXXXX)',s.phone_number||'');if(ph===null)return;const clean=ph.replace(/[\s-]/g,'');if(clean&&!/^01[3-9]\d{8}$/.test(clean))return alert('সঠিক ১১ সংখ্যার বাংলাদেশি মোবাইল নম্বর দিন');const{error}=await sb.from('profiles').update({name:n.trim(),phone_number:clean||null}).eq('id',s.id);if(error)return alert('আপডেট হয়নি: '+error.message);reload()};
const setActive=async(s,active)=>{const action=active?'আবার সক্রিয়':'আর্কাইভ';if(!confirm(s.name+' — '+action+' করবেন? '+(active?'শিক্ষার্থী আবার লগইন করতে পারবে।':'লগইন বন্ধ হবে, কিন্তু ক্লাস সম্পন্নের তথ্য ও Marks অক্ষত থাকবে।')))return;const{error}=await sb.from('profiles').update({active}).eq('id',s.id);if(error)return alert('পরিবর্তন হয়নি: '+error.message);await reload();alert(active?'শিক্ষার্থী আবার সক্রিয় হয়েছে।':'শিক্ষার্থী আর্কাইভ হয়েছে। পুরোনো হাজিরা ও নম্বর অক্ষত আছে।')};
const norm=x=>String(x||'').trim().toLowerCase().replace(/\s+/g,' ');
const active=st.filter(x=>x.active),inactive=st.filter(x=>!x.active);
const phoneCounts={},nameCounts={};st.forEach(x=>{const nk=norm(x.name);nameCounts[nk]=(nameCounts[nk]||0)+1;if(x.phone_number){const k=String(x.phone_number).replace(/\D/g,'');phoneCounts[k]=(phoneCounts[k]||0)+1}});
const delStudent=async s=>{if(!confirm('“'+s.name+'” কে চিরতরে মুছবেন? তার ক্লাস সম্পন্নের তথ্য ও পরীক্ষার নম্বরও মুছে যাবে। এটা ফেরানো যাবে না।'))return;if(!confirm('শেষবার নিশ্চিত করুন: সত্যিই মুছে ফেলবেন?'))return;const{error}=await sb.rpc('delete_student',{sid:s.id});if(error)return alert('মোছা যায়নি: '+error.message);reload()};
const filtered=st.filter(x=>(view==='active'?x.active:view==='archived'?!x.active:true)&&(!q||norm(x.name).includes(norm(q))||norm(x.student_code).includes(norm(q))||String(x.phone_number||'').includes(q)));
return html`<div class="space-y-3"><div class="g p-3 space-y-2"><div class="font-semibold">সবার জন্য একটি পিন</div><div class="text-xs text-blue-200">শিক্ষার্থীরা প্রথমবার নাম ও এই পিন দিয়ে ঢুকলে নিজেই তালিকায় যোগ হবে</div><div class="text-sm">বর্তমান পিন: <b class="gold">${cur===null?'...':cur||'এখনো সেট করা হয়নি'}</b></div><input placeholder="নতুন পিন (কমপক্ষে ৬ অক্ষর)" value=${upin} onInput=${e=>setUpin(e.target.value)}/><button class="btn w-full" onClick=${setPin}>পিন সেট করুন</button></div>

const Q=async f=>{try{const r=await f;return r.data||[]}catch(e){return[]}};
/* ===== ক্লাস সময়সীমা (ডিফল্ট ২৪ ঘণ্টা) ===== */
const LIM_KEY='class_limits';
const loadLim=async()=>{try{const r=await sb.from('app_settings').select('value').eq('key',LIM_KEY).maybeSingle();return(r.data&&r.data.value)||{}}catch(e){return{}}};
const saveLim=async(id,h)=>{const cur=await loadLim();cur[id]=h;const{error}=await sb.from('app_settings').upsert({key:LIM_KEY,value:cur,updated_at:new Date().toISOString()});return error};
const limH=(L,c)=>{const v=L&&L[c.id];return v>0?+v:24};
const dueAt=(c,L)=>new Date(c.created_at||String(c.class_date).slice(0,10)+'T00:00:00').getTime()+limH(L,c)*3600000;
const bnD=x=>String(x).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const hms=ms=>{const t=Math.max(0,Math.floor(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60,p=n=>String(n).padStart(2,'0');return bnD(p(h)+':'+p(m)+':'+p(s))};
const useNow=()=>{const[n,setN]=useState(Date.now());useEffect(()=>{const t=setInterval(()=>setN(Date.now()),1000);return()=>clearInterval(t)},[]);return n};
function CD({c,L,done}){const n=useNow(),left=dueAt(c,L)-n;
if(done)return html`<div class="text-green-600 text-xs font-semibold">✓ সম্পন্ন · +${c.xp||0} পয়েন্ট</div>`;
if(left<=0)return html`<div class="text-xs font-bold text-red-600">⌛ সময় শেষ</div>`;
return html`<div class=${'cdw '+(left<3600000?'urgent':'')}>⏳ বাকি ${hms(left)}</div>`}

function BigCD({c,L,done}){const n=useNow(),left=dueAt(c,L)-n;
if(done)return html`<div class="text-2xl font-bold text-green-600">✓ ক্লাস সম্পন্ন · +${c.xp||0} পয়েন্ট</div>`;
if(left<=0)return html`<div class="text-2xl font-bold text-red-600">⌛ সময় শেষ</div>`;
return html`<div><div class="text-xs text-blue-300">ক্লাস সম্পন্ন করার বাকি সময়</div><div class=${'cdw big '+(left<3600000?'urgent':'')}>${hms(left)}</div></div>`}

/* ===== অ্যাডমিন স্ক্রিন রেকর্ডার ===== */
function Recorder(){const uR=React.useRef({});
const[st,setSt]=useState('idle'),[sec,setSec]=useState(0),[mic,setMic]=useState(true),[url,setUrl]=useState(null),[blob,setBlob]=useState(null),[nm,setNm]=useState(''),[list,setList]=useState([]),[busy,setBusy]=useState(false);
const sup=!!(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia&&window.MediaRecorder);
const pickMime=()=>['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
const extOf=b=>(b&&String(b.type).includes('mp4'))?'mp4':'webm';
const clock=x=>{const p=n=>String(n).padStart(2,'0');return p(Math.floor(x/3600))+':'+p(Math.floor(x%3600/60))+':'+p(x%60)};
useEffect(()=>{if(st!=='rec'&&st!=='pause')return;const w=e=>{e.preventDefault();e.returnValue=''};addEventListener('beforeunload',w);return()=>removeEventListener('beforeunload',w)},[st]);
const refresh=async()=>{try{const{data,error}=await sb.storage.from('recordings').list('',{limit:100,sortBy:{column:'created_at',order:'desc'}});if(!error)setList((data||[]).filter(x=>x.name&&x.id))}catch(e){}};

const start=async()=>{try{
if(url){URL.revokeObjectURL(url);setUrl(null);setBlob(null)}
const disp=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:true});
const streams=[disp];let micS=null;
if(mic){try{micS=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});streams.push(micS)}catch(e){alert('মাইক্রোফোন চালু হয়নি। শুধু স্ক্রিন (ও সিস্টেম সাউন্ড) রেকর্ড হবে।')}}
const tracks=[...disp.getVideoTracks()];let ctx=null;
const sysA=disp.getAudioTracks().length>0;
if(sysA||micS){ctx=new(window.AudioContext||window.webkitAudioContext)();const dest=ctx.createMediaStreamDestination();if(sysA)ctx.createMediaStreamSource(new MediaStream(disp.getAudioTracks())).connect(dest);if(micS)ctx.createMediaStreamSource(micS).connect(dest);tracks.push(...dest.stream.getAudioTracks())}
const mt=pickMime();const rec=new MediaRecorder(new MediaStream(tracks),mt?{mimeType:mt,videoBitsPerSecond:2500000}:{videoBitsPerSecond:2500000});
const chunks=[];
rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
rec.onstop=()=>{clearInterval(uR.current.t);streams.forEach(x=>x.getTracks().forEach(t=>t.stop()));if(ctx)ctx.close();const b=new Blob(chunks,{type:rec.mimeType||mt||'video/webm'});setBlob(b);setUrl(URL.createObjectURL(b));setSt('done')};
disp.getVideoTracks()[0].onended=()=>{if(rec.state!=='inactive')rec.stop()};
rec.start(1000);setSec(0);setSt('rec');
uR.current={rec,t:setInterval(()=>{const r=uR.current.rec;if(r&&r.state==='recording')setSec(x=>x+1)},1000)};
if(!sysA)console.info('সিস্টেম সাউন্ড শেয়ার করা হয়নি');
}catch(e){setSt('idle');if(e&&e.name!=='NotAllowedError')alert('রেকর্ড শুরু হয়নি: '+(e.message||e))}};
const pause=()=>{const r=uR.current.rec;if(!r)return;if(r.state==='recording'){r.pause();setSt('pause')}else if(r.state==='paused'){r.resume();setSt('rec')}};
const stop=()=>{const r=uR.current.rec;if(r&&r.state!=='inactive')r.stop()};
const fname=()=>((nm.trim().replace(/[^\w\u0980-\u09FF.-]+/g,'_'))||'class-recording-'+today())+'.'+extOf(blob);
const upload=async()=>{if(!blob)return;const safe=(nm.trim().replace(/[^\w.-]+/g,'_'))||'class';const path=Date.now()+'-'+safe+'.'+extOf(blob);setBusy(true);const{error}=await sb.storage.from('recordings').upload(path,blob,{contentType:blob.type,upsert:false});setBusy(false);if(error)return alert('ক্লাউডে সেভ হয়নি: '+error.message+'\n\nফাইল বড় হলে (Supabase ফ্রি প্ল্যানে সীমা ৫০MB) ডাউনলোড করে নিন।');alert('ক্লাউডে সেভ হয়েছে ✓');refresh()};
const dl=async x=>{const{data,error}=await sb.storage.from('recordings').createSignedUrl(x.name,3600,{download:x.name});if(error)return alert(error.message);window.open(data.signedUrl,'_blank')};
const rm=async x=>{if(!confirm('রেকর্ডিংটি মুছবেন?'))return;const{error}=await sb.storage.from('recordings').remove([x.name]);if(error)return alert(error.message);refresh()};
const mb=x=>x&&x.metadata&&x.metadata.size?(x.metadata.size/1048576).toFixed(1)+' MB':'';
