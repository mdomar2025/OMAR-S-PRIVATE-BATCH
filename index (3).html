function Login({done}){const[adm,setAdm]=useState(false),[names,setNames]=useState([]),[id,setId]=useState(''),[pin,setPin]=useState(''),[phone,setPhone]=useState(''),[err,setErr]=useState(''),[busy,setBusy]=useState(false);

function Admin(){const[tab,setTab]=useState('ch'),[chs,setChs]=useState([]),[arch,setArch]=useState([]),[st,setSt]=useState([]),[open,setOpen]=useState(null),[f,setF]=useState({name:'',all:true});

function Chal({ch,st}){const[tab,setTab]=useState('att'),[dl,setDl]=useState([]),[date,setDate]=useState(today()),[pres,setPres]=useState(new Set()),[days,setDays]=useState(0),[ex,setEx]=useState([]),[lb,setLb]=useState([]),[mem,setMem]=useState(new Set());

function Exams({act,ex,reload,cid}){const[f,setF]=useState({name:'',date:today(),total:20}),[sel,setSel]=useState(null),[m,setM]=useState({});
const open=async e=>{setSel(e);const{data}=await sb.from('marks').select('*').eq('exam_id',e.id);const o={};(data||[]).forEach(r=>o[r.student_id]=r.marks);setM(o)};
const create=async()=>{if(!f.name.trim())return alert('পরীক্ষার নাম লিখুন');
const{data,error}=await sb.from('exams').insert({challenge_id:cid,name:f.name.trim(),exam_date:f.date,total:+f.total}).select().single();
if(error)return alert(error.message);setF({...f,name:''});await reload();open(data)};
const save=async()=>{const rows=Object.entries(m).filter(([,v])=>v!==''&&v!=null).map(([id,v])=>({exam_id:sel.id,student_id:id,marks:+v}));
if(rows.some(r=>r.marks>sel.total||r.marks<0))return alert('নম্বর সঠিক নয়');
const{error}=await sb.from('marks').upsert(rows);alert(error?error.message:'সংরক্ষিত হয়েছে ✓');reload()};
const rank=act.filter(s=>m[s.id]!==undefined&&m[s.id]!=='').sort((a,b)=>m[b.id]-m[a.id]);
return html`<div class="space-y-3"><div class="g p-3 space-y-2"><div class="font-semibold">নতুন পরীক্ষা</div>
<input placeholder="পরীক্ষার নাম" value=${f.name} onInput=${e=>setF({...f,name:e.target.value})}/>
<div class="flex gap-2"><input type="date" value=${f.date} onInput=${e=>setF({...f,date:e.target.value})}/><input type="number" placeholder="মোট নম্বর" value=${f.total} onInput=${e=>setF({...f,total:e.target.value})}/></div>
<button class="btn w-full" onClick=${create}>পরীক্ষা তৈরি করুন</button></div>
<div class="flex gap-2 overflow-x-auto">${ex.map(e=>html`<button key=${e.id} onClick=${()=>open(e)} class=${'tab whitespace-nowrap '+(sel&&sel.id===e.id?'on':'g')}>${e.name}</button>`)}</div>

${act.map(s=>html`<div key=${s.id} class="flex items-center justify-between gap-3"><span>${s.name}</span><input class="!w-24" type="number" step="0.5" value=${m[s.id]??''} onInput=${e=>setM({...m,[s.id]:e.target.value})}/></div>`)}
<button class="btn w-full" onClick=${save}>Save</button>

function Students({st,reload}){const[name,setName]=useState(''),[phone,setPhone]=useState(''),[upin,setUpin]=useState(''),[cur,setCur]=useState(null),[busy,setBusy]=useState(false),[q,setQ]=useState(''),[view,setView]=useState('active');
const loadP=async()=>{const{data}=await sb.from('settings').select('value').eq('key','pin').maybeSingle();setCur(data?data.value:'')};

const add=async()=>{const n=name.trim();if(!n)return alert('শিক্ষার্থীর নাম লিখুন');if(!/^01[3-9]\d{8}$/.test(phone.replace(/[\s-]/g,'')))return alert('সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন');if(!cur)return alert('আগে ইউনিভার্সাল পিন সেট করুন');const mx=Math.max(0,...st.map(s=>parseInt((s.student_code||'').replace(/\D/g,''))||0));const code='opb'+String(mx+1).padStart(2,'0');setBusy(true);const tmp=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const{error}=await tmp.auth.signUp({email:toEmail(code),password:cur,options:{data:{name:n,student_code:code,phone_number:phone.replace(/[\s-]/g,'')}}});setBusy(false);if(error)return alert(error.message);setName('');setPhone('');reload()};
const rename=async s=>{const n=prompt('নতুন নাম',s.name);if(n===null||!n.trim())return;const ph=prompt('মোবাইল / WhatsApp নম্বর (০১XXXXXXXXX)',s.phone_number||'');if(ph===null)return;const clean=ph.replace(/[\s-]/g,'');if(clean&&!/^01[3-9]\d{8}$/.test(clean))return alert('সঠিক ১১ সংখ্যার বাংলাদেশি মোবাইল নম্বর দিন');const{error}=await sb.from('profiles').update({name:n.trim(),phone_number:clean||null}).eq('id',s.id);if(error)return alert('আপডেট হয়নি: '+error.message);reload()};
const setActive=async(s,active)=>{const action=active?'আবার সক্রিয়':'আর্কাইভ';if(!confirm(s.name+' — '+action+' করবেন? '+(active?'শিক্ষার্থী আবার লগইন করতে পারবে।':'লগইন বন্ধ হবে, কিন্তু Attendance ও Marks অক্ষত থাকবে।')))return;const{error}=await sb.from('profiles').update({active}).eq('id',s.id);if(error)return alert('পরিবর্তন হয়নি: '+error.message);await reload();alert(active?'শিক্ষার্থী আবার সক্রিয় হয়েছে।':'শিক্ষার্থী আর্কাইভ হয়েছে। পুরোনো হাজিরা ও নম্বর অক্ষত আছে।')};
const norm=x=>String(x||'').trim().toLowerCase().replace(/\s+/g,' ');
const active=st.filter(x=>x.active),inactive=st.filter(x=>!x.active);
const phoneCounts={},nameCounts={};st.forEach(x=>{const nk=norm(x.name);nameCounts[nk]=(nameCounts[nk]||0)+1;if(x.phone_number){const k=String(x.phone_number).replace(/\D/g,'');phoneCounts[k]=(phoneCounts[k]||0)+1}});
const delStudent=async s=>{if(!confirm('“'+s.name+'” কে চিরতরে মুছবেন? তার হাজিরা ও পরীক্ষার নম্বরও মুছে যাবে। এটা ফেরানো যাবে না।'))return;if(!confirm('শেষবার নিশ্চিত করুন: সত্যিই মুছে ফেলবেন?'))return;const{error}=await sb.rpc('delete_student',{sid:s.id});if(error)return alert('মোছা যায়নি: '+error.message);reload()};
const filtered=st.filter(x=>(view==='active'?x.active:view==='archived'?!x.active:true)&&(!q||norm(x.name).includes(norm(q))||norm(x.student_code).includes(norm(q))||String(x.phone_number||'').includes(q)));
return html`<div class="space-y-3"><div class="g p-3 space-y-2"><div class="font-semibold">সবার জন্য একটি পিন</div><div class="text-xs text-blue-200">শিক্ষার্থীরা প্রথমবার নাম ও এই পিন দিয়ে ঢুকলে নিজেই তালিকায় যোগ হবে</div><div class="text-sm">বর্তমান পিন: <b class="gold">${cur===null?'...':cur||'এখনো সেট করা হয়নি'}</b></div><input placeholder="নতুন পিন (কমপক্ষে ৬ অক্ষর)" value=${upin} onInput=${e=>setUpin(e.target.value)}/><button class="btn w-full" onClick=${setPin}>পিন সেট করুন</button></div>
<div class="g p-3 space-y-2"><div class="font-semibold">শিক্ষার্থী যোগ করুন</div><input placeholder="শিক্ষার্থীর নাম" value=${name} onInput=${e=>setName(e.target.value)}/><input placeholder="মোবাইল / WhatsApp নম্বর" value=${phone} onInput=${e=>setPhone(e.target.value)}/><button class="btn w-full" disabled=${busy} onClick=${add}>${busy?'অপেক্ষা করুন...':'শিক্ষার্থী যোগ করুন'}</button></div>
<div class="g p-3 space-y-2"><div class="font-semibold">শিক্ষার্থী ব্যবস্থাপনা</div><div class="text-xs text-blue-200">সক্রিয়: ${active.length} · আর্কাইভ: ${inactive.length} · মোট: ${st.length}</div><input placeholder="নাম / Student ID / মোবাইল দিয়ে খুঁজুন" value=${q} onInput=${e=>setQ(e.target.value)}/><div class="flex gap-2 flex-wrap"><button class=${'tab '+(view==='active'?'on':'g')} onClick=${()=>setView('active')}>সক্রিয় (${active.length})</button><button class=${'tab '+(view==='archived'?'on':'g')} onClick=${()=>setView('archived')}>আর্কাইভ (${inactive.length})</button><button class=${'tab '+(view==='all'?'on':'g')} onClick=${()=>setView('all')}>সবাই (${st.length})</button></div>
<div class="text-xs text-yellow-200">আর্কাইভ করলে লগইন বন্ধ হয়, কিন্তু হাজিরা ও নম্বর থাকে। অতিরিক্ত বা ভুল অ্যাকাউন্ট হলে “চিরতরে মুছুন” দিন।</div>
<div class="divide-y divide-white/10">${filtered.length===0&&html`<div class="p-4 text-center text-blue-200">কোনো শিক্ষার্থী পাওয়া যায়নি</div>`}${filtered.map(s=>{const ph=String(s.phone_number||'').replace(/\D/g,'');const duplicate=ph&&phoneCounts[ph]>1, sameName=nameCounts[norm(s.name)]>1;return html`<div key=${s.id} class="py-3 flex flex-col gap-2"><div class="flex items-start justify-between gap-2"><div class=${s.active?'':'opacity-60'}><b>${s.name}</b><div class="text-xs text-blue-200">ID: ${s.student_code||'নেই'} · ${s.phone_number||'নম্বর নেই'}</div>${duplicate&&html`<div class="text-xs text-yellow-300">⚠ একই মোবাইল নম্বরে একাধিক অ্যাকাউন্ট</div>`}${sameName&&html`<div class="text-xs text-yellow-300">⚠ একই নামের একাধিক অ্যাকাউন্ট—ID ও নম্বর মিলিয়ে দেখুন</div>`}${!s.active&&html`<div class="text-xs text-red-300">আর্কাইভ করা</div>`}</div><div class="flex gap-3 text-sm shrink-0"><button class="underline" onClick=${()=>rename(s)}>এডিট</button>${waLink(s.phone_number)&&html`<a class="text-green-300 underline" href=${waLink(s.phone_number)} target="_blank" rel="noopener">WhatsApp</a>`}</div></div><div class="flex gap-2">${s.active?html`<button class="text-red-300 border border-red-400/40 rounded-lg px-3 py-1 text-sm" onClick=${()=>setActive(s,false)}>আর্কাইভ / ডিলিট</button>`:html`<button class="text-green-300 border border-green-400/40 rounded-lg px-3 py-1 text-sm" onClick=${()=>setActive(s,true)}>ফিরিয়ে আনুন</button>`}<button class="text-red-300 border border-red-400/40 rounded-lg px-3 py-1 text-sm" onClick=${()=>delStudent(s)}>চিরতরে মুছুন</button></div></div>`})}</div></div></div>`}

function Board({lb,me}){return html`<div class="g divide-y divide-white/10">${lb.length===0&&html`<div class="p-4 text-center">এখনো কোনো তথ্য নেই</div>`}
${lb.map((r,i)=>html`<div key=${r.student_id} class=${'p-3 flex justify-between '+(r.student_id===me?'bg-yellow-400/20':'')}><span><b class="gold">${i+1}</b> ${r.name}</span><span class="font-bold">${r.score}</span></div>`)}
<div class="p-2 text-xs text-center text-blue-200">স্কোর = ৫০% উপস্থিতি + ৫০% পরীক্ষার গড়</div></div>`}

function SChal({p,ch}){const[d,setD]=useState(null);
const load=async()=>{const[a,c,m,l,k]=await Promise.all([sb.from('attendance').select('day').eq('student_id',p.id).eq('challenge_id',ch.id),sb.rpc('class_days',{cid:ch.id}),
sb.from('marks').select('marks,exams!inner(name,exam_date,total,challenge_id)').eq('student_id',p.id).eq('exams.challenge_id',ch.id),sb.rpc('leaderboard',{cid:ch.id}),sb.rpc('challenge_marks',{cid:ch.id})]);
setD({a:new Set((a.data||[]).map(r=>r.day)),c:(c.data||[]).map(r=>r.day),m:m.data||[],l:l.data||[],k:k.data||[]})};
useEffect(()=>{load();const t=setInterval(load,30000);return()=>clearInterval(t)},[]);
if(!d)return html`<div class="text-center p-8">লোড হচ্ছে...</div>`;
const done=d.c.filter(x=>d.a.has(x)).length,pct=Math.round(done/90*100),pos=d.l.findIndex(r=>r.student_id===p.id)+1;
const box=i=>{const day=d.c[i];return day?(d.a.has(day)?'bg-green-500':'bg-red-500'):'bg-white/15'};
return html`<div class="space-y-3 fade"><div class="text-xl font-bold gold text-center">${ch.name}</div><div class="g p-4"><div class="font-semibold">${p.name} <span class="text-xs text-blue-300">(${p.student_code})</span></div>${p.phone_number&&html`<a class="inline-flex items-center gap-2 text-green-300 underline text-sm mt-2" href=${waLink(p.phone_number)||'#'} target="_blank" rel="noopener">WhatsApp-এ যোগাযোগ</a>`}
<div class="flex justify-between text-sm mt-2"><span>অগ্রগতি</span><span class="gold font-bold">${pct}%</span></div>
<div class="h-3 rounded-full bg-white/10 overflow-hidden mt-1"><div class="h-full" style=${{width:pct+'%',background:'linear-gradient(90deg,#f5c542,#c9971c)',transition:'width 1s'}}></div></div></div>
<div class="grid grid-cols-2 gap-2">${[['বর্তমান দিন',Math.min(d.c.length,90)],['সম্পন্ন দিন',done],['বাকি দিন',90-done],['লিডারবোর্ডে অবস্থান',pos?'#'+pos:'-']].map(([l,v])=>html`<div key=${l} class="g p-3 text-center"><div class="text-2xl font-bold gold">${v}</div><div class="text-xs">${l}</div></div>`)}</div>
<div class="g p-4"><div class="font-semibold mb-2">৯০ দিনের ট্র্যাকার</div><div class="grid grid-cols-10 gap-1">${Array.from({length:90},(_,i)=>html`<div key=${i} title=${d.c[i]?fmtS(d.c[i]):''} class=${'aspect-square rounded text-[9px] flex items-center justify-center '+box(i)}>${i+1}</div>`)}</div>
<div class="flex gap-3 text-xs mt-2"><span>🟩 ক্লাস হয়েছে</span><span>🟥 অনুপস্থিত</span><span>⬜ আসছে</span></div></div>
<div class="g p-4"><div class="font-semibold mb-2">ক্লাসের তারিখ</div>${d.c.length===0&&html`<div class="text-sm">এখনো কোনো ক্লাস হয়নি</div>`}${d.c.slice().reverse().map(x=>html`<div key=${x} class="flex justify-between text-sm py-1"><span>${fmtS(x)}</span><b class=${d.a.has(x)?'text-green-400':'text-red-400'}>${d.a.has(x)?'✓ উপস্থিত':'✗ অনুপস্থিত'}</b></div>`)}</div>
<div class="g p-4"><div class="font-semibold mb-2">পরীক্ষার নম্বর</div>${d.m.length===0&&html`<div class="text-sm">এখনো কোনো পরীক্ষা নেই</div>`}

<${AllMarks} k=${d.k} lb=${d.l}/><${Board} lb=${d.l} me=${p.id}/></div>`}

function AllMarks({k,lb}){const ex=[...new Map(k.map(r=>[r.exam_id,r])).values()].sort((a,b)=>a.exam_date<b.exam_date?-1:1);

const ids=new Set((m.data||[]).map(r=>r.challenge_id));const mine=(c.data||[]).filter(x=>x.all_students||ids.has(x.id));setChs(mine);if(mine.length===1)setOpen(mine[0])})()},[]);
