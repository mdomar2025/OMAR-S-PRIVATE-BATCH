<script>const yt=u=>{const m=String(u||'').match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:null};
const lvlOf=(xp,L)=>{let c=L[0]||{n:'-',xp:0};L.forEach(x=>{if(xp>=x.xp)c=x});return c};
function Shell({p}){const[m,setM]=useState('ch'),[F,setF]=useState({classes:true,xp:true,announcements:true});
useEffect(()=>{sb.from('app_settings').select('value').eq('key','features').maybeSingle().then(r=>r.data&&setF(r.data.value))},[]);
const adm=p.role==='admin',B=(k,l)=>html`<button class=${'tab '+(m===k?'on':'g')} onClick=${()=>setM(k)}>${l}</button>`;
return html`<div><div class="flex gap-2 mb-4">${B('ch','চ্যালেঞ্জ')}${(F.classes||adm)&&B('plus','ক্লাস ও XP')}</div>
${m==='ch'?(adm?html`<${Admin}/>`:html`<${Student} p=${p}/>`):(adm?html`<${AdminPlus} F=${F} setF=${setF}/>`:html`<${StudentPlus} p=${p} F=${F}/>`)}</div>`}
function AdminPlus({F,setF}){const[cl,setCl]=useState([]),[an,setAn]=useState([]),[f,setf]=useState({title:'',url:'',xp:10,date:today(),pub:true}),[a,setA]=useState({title:'',body:''});
const load=async()=>{const[c,n]=await Promise.all([sb.from('classes').select('*').order('class_date',{ascending:false}),sb.from('announcements').select('*').order('created_at',{ascending:false})]);setCl(c.data||[]);setAn(n.data||[])};useEffect(()=>{load()},[]);
const add=async()=>{if(!f.title.trim())return alert('ক্লাসের নাম লিখুন');if(f.url&&!yt(f.url))return alert('সঠিক YouTube লিংক দিন');const{error}=await sb.from('classes').insert({title:f.title.trim(),youtube_url:f.url||null,xp:+f.xp||0,class_date:f.date,published:f.pub});if(error)return alert(error.message);setf({...f,title:'',url:''});load()};
const tog=async c=>{await sb.from('classes').update({published:!c.published}).eq('id',c.id);load()};
const del=async c=>{if(confirm('ক্লাসটি মুছবেন? (XP ইতিহাস থাকবে)')){await sb.from('classes').delete().eq('id',c.id);load()}};
const post=async()=>{if(!a.title.trim())return;const{error}=await sb.from('announcements').insert({title:a.title.trim(),body:a.body});if(error)return alert(error.message);setA({title:'',body:''});load()};
const saveF=async n=>{setF(n);const{error}=await sb.from('app_settings').upsert({key:'features',value:n,updated_at:new Date().toISOString()});if(error)alert(error.message)};
return html`<div class="space-y-3"><div class="g p-3 space-y-2"><div class="font-semibold">ফিচার চালু/বন্ধ</div>${[['classes','ক্লাস'],['xp','XP ও লিডারবোর্ড'],['announcements','ঘোষণা']].map(([k,l])=>html`<label key=${k} class="flex gap-2 items-center"><input type="checkbox" class="!w-5 !h-5" checked=${F[k]!==false} onChange=${e=>saveF({...F,[k]:e.target.checked})}/>${l}</label>`)}</div>
<div class="g p-3 space-y-2"><div class="font-semibold">নতুন ক্লাস</div><input placeholder="ক্লাসের নাম" value=${f.title} onInput=${e=>setf({...f,title:e.target.value})}/><input placeholder="YouTube লিংক" value=${f.url} onInput=${e=>setf({...f,url:e.target.value})}/><div class="flex gap-2"><input type="date" value=${f.date} onInput=${e=>setf({...f,date:e.target.value})}/><input type="number" placeholder="XP" value=${f.xp} onInput=${e=>setf({...f,xp:e.target.value})}/></div><label class="flex gap-2"><input type="checkbox" class="!w-5 !h-5" checked=${f.pub} onChange=${e=>setf({...f,pub:e.target.checked})}/>প্রকাশ করুন</label><button class="btn w-full" onClick=${add}>ক্লাস যোগ করুন</button></div>
${cl.map(c=>html`<div key=${c.id} class="g p-3 flex justify-between items-center gap-2"><span class="min-w-0">${c.title}<div class="text-xs text-blue-200">${c.class_date} · ${c.xp} XP · ${c.published?'প্রকাশিত':'ড্রাফট'}</div></span><span class="flex gap-2 text-xs"><button class="underline" onClick=${()=>tog(c)}>${c.published?'লুকান':'প্রকাশ'}</button><button class="underline text-red-300" onClick=${()=>del(c)}>মুছুন</button></span></div>`)}
<div class="g p-3 space-y-2"><div class="font-semibold">ঘোষণা</div><input placeholder="শিরোনাম" value=${a.title} onInput=${e=>setA({...a,title:e.target.value})}/><input placeholder="বিবরণ" value=${a.body} onInput=${e=>setA({...a,body:e.target.value})}/><button class="btn w-full" onClick=${post}>প্রকাশ</button>${an.map(x=>html`<div key=${x.id} class="text-sm flex justify-between"><span>${x.title}</span><button class="underline text-red-300 text-xs" onClick=${async()=>{await sb.from('announcements').delete().eq('id',x.id);load()}}>মুছুন</button></div>`)}</div></div>`}
function StudentPlus({p,F}){const[d,setD]=useState(null);
const load=async()=>{const[c,k,x,l,n,s]=await Promise.all([sb.from('classes').select('*').eq('published',true).order('class_date',{ascending:false}).limit(30),sb.from('class_completions').select('class_id').eq('student_id',p.id),sb.from('xp_transactions').select('amount').eq('student_id',p.id),sb.rpc('xp_leaderboard'),sb.from('announcements').select('*').order('pinned',{ascending:false}).order('created_at',{ascending:false}).limit(5),sb.from('app_settings').select('value').eq('key','levels').maybeSingle()]);
setD({c:c.data||[],k:new Set((k.data||[]).map(r=>r.class_id)),xp:(x.data||[]).reduce((s,r)=>s+r.amount,0),l:l.data||[],n:n.data||[],L:(s.data&&s.data.value)||[{n:'Starter',xp:0}]})};useEffect(()=>{load()},[]);
const done=async c=>{const{error}=await sb.rpc('complete_class',{cid:c.id});if(error)alert(error.message);load()};
if(!d)return html`<div class="text-center p-8">লোড হচ্ছে...</div>`;const lv=lvlOf(d.xp,d.L);
return html`<div class="space-y-3 fade">${F.xp!==false&&html`<div class="g p-4 text-center"><div class="text-3xl font-bold gold">${d.xp} XP</div><div>লেভেল: ${lv.n}</div></div>`}
${F.announcements!==false&&d.n.map(x=>html`<div key=${x.id} class="g p-3"><b>${x.pinned?'📌 ':''}${x.title}</b><div class="text-sm">${x.body}</div></div>`)}
${d.c.map(c=>{const id=yt(c.youtube_url),ok=d.k.has(c.id);return html`<div key=${c.id} class="g p-3 space-y-2"><div class="font-semibold">${c.title} <span class="text-xs text-blue-300">${c.class_date}</span></div>${id&&html`<iframe class="w-full aspect-video rounded" src=${'https://www.youtube-nocookie.com/embed/'+id} allowfullscreen loading="lazy"></iframe>`}${ok?html`<div class="text-green-400 text-sm">✓ সম্পন্ন</div>`:html`<button class="btn w-full" onClick=${()=>done(c)}>ক্লাস সম্পন্ন (+${c.xp} XP)</button>`}</div>`})}
${F.xp!==false&&html`<div class="g divide-y divide-white/10"><div class="p-3 font-semibold">XP লিডারবোর্ড</div>${d.l.map((r,i)=>html`<div key=${r.student_id} class=${'p-3 flex justify-between '+(r.student_id===p.id?'bg-yellow-400/20':'')}><span><b class="gold">${i<3?['🥇','🥈','🥉'][i]:i+1}</b> ${r.name}</span><b>${r.xp}</b></div>`)}</div>`}</div>`}
</script>
<script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const UIx={classes:'ক্লাস ও XP',comm:'কমিউনিটি',mcq:'MCQ পরীক্ষা',comp:'প্রতিযোগিতা',rew:'রিওয়ার্ড',ana:'অ্যানালিটিক্স',set:'সেটিংস'};
const sv=async(k,v)=>{const{error}=await sb.from('app_settings').upsert({key:k,value:v,updated_at:new Date().toISOString()});alert(error?error.message:'সংরক্ষিত ✓')};
function ShellX({p}){const adm=p.role==='admin',[m,setM]=useState('ch'),[F,setF]=useState({}),[U,setU]=useState({});
useEffect(()=>{sb.from('app_settings').select('key,value').in('key',['features','ui']).then(r=>(r.data||[]).forEach(x=>x.key==='features'?setF(x.value):setU(x.value)))},[]);
useEffect(()=>{const a=U.accent;let s=document.getElementById('thx');if(!s){s=document.createElement('style');s.id='thx';document.head.appendChild(s)}s.textContent=a?`.gold{color:${a}!important}.btn{background:${a}!important;color:#111!important}`:''},[U.accent]);
const L=k=>(U.labels&&U.labels[k])||UIx[k];
const tabs=[['ch','চ্যালেঞ্জ'],['classes',L('classes')],['comm',L('comm')],['mcq',L('mcq')],['comp',L('comp')],...(adm?[['ana',L('ana')],['set',L('set')]]:[['rew',L('rew')]])].filter(([k])=>k==='ch'||adm||F[k]!==false);
return html`<div><div class="flex gap-2 mb-4 overflow-x-auto">${tabs.map(([k,l])=>html`<button key=${k} class=${'tab whitespace-nowrap '+(m===k?'on':'g')} onClick=${()=>setM(k)}>${l}</button>`)}</div>
${!adm&&html`<${Remind} p=${p} U=${U}/>`}
${m==='ch'?(adm?html`<${Admin}/>`:html`<${Student} p=${p}/>`):m==='classes'?(adm?html`<${AdminPlus} F=${F} setF=${setF}/>`:html`<${StudentPlus} p=${p} F=${F}/>`):m==='comm'?html`<${Comm} p=${p} adm=${adm}/>`:m==='mcq'||m==='comp'?(adm?html`<${McqAdmin} key=${m} kind=${m}/>`:html`<${McqStudent} key=${m} p=${p} kind=${m}/>`):m==='rew'?html`<${Rewards} p=${p}/>`:m==='ana'?html`<${Ana}/>`:html`<${Settings} F=${F} setF=${setF} U=${U} setU=${setU}/>`}</div>`}
function Remind({p,U}){const[n,setN]=useState(0);const r=U.rem||{};
useEffect(()=>{(async()=>{const[c,k]=await Promise.all([sb.from('classes').select('id').eq('published',true).eq('class_date',today()),sb.from('class_completions').select('class_id').eq('student_id',p.id)]);const d=new Set((k.data||[]).map(x=>x.class_id));setN((c.data||[]).filter(x=>!d.has(x.id)).length)})()},[]);
const hr=+new Date().toLocaleString('en-GB',{hour:'2-digit',hour12:false,timeZone:'Asia/Dhaka'});
if(r.on===false||!n||hr<(r.hour??16))return null;return html`<div class="g p-3 mb-3 text-yellow-200">⏰ ${r.msg||'আজকের ক্লাস এখনো সম্পন্ন করেননি!'} (${n}টি)</div>`}
function Comm({p,adm}){const[ps,setPs]=useState([]),[t,setT]=useState(''),[lk,setLk]=useState([]),[cm,setCm]=useState([]),[nm,setNm]=useState({});
const load=async()=>{const{data}=await sb.from('posts').select('*').order('pinned',{ascending:false}).order('created_at',{ascending:false}).limit(40);setPs(data||[]);const ids=(data||[]).map(x=>x.id);if(!ids.length)return;const[l,c]=await Promise.all([sb.from('post_likes').select('post_id,user_id').in('post_id',ids),sb.from('post_comments').select('*').in('post_id',ids).order('created_at')]);setLk(l.data||[]);setCm(c.data||[])};useEffect(()=>{load()},[]);
const E=async r=>{if(r.error)alert(r.error.message);load()};
return html`<div class="space-y-3"><div class="g p-3 space-y-2"><textarea class="w-full" rows="2" maxlength="1000" placeholder="কিছু লিখুন..." value=${t} onInput=${e=>setT(e.target.value)}></textarea><button class="btn w-full" onClick=${async()=>{if(!t.trim())return;const r=await sb.from('posts').insert({body:t.trim()});if(!r.error)setT('');E(r)}}>পোস্ট</button></div>
${ps.map(x=>{const L=lk.filter(l=>l.post_id===x.id),me=L.some(l=>l.user_id===p.id);return html`<div key=${x.id} class="g p-3 space-y-2"><div class="text-sm"><b class="gold">${x.pinned?'📌 ':''}${x.author_name||'?'}</b> <span class="text-xs text-blue-300">${new Date(x.created_at).toLocaleString('bn-BD',{timeZone:'Asia/Dhaka'})}</span></div><div style=${{whiteSpace:'pre-wrap'}}>${x.body}</div>
<div class="flex gap-3 text-xs"><button onClick=${async()=>E(me?await sb.from('post_likes').delete().eq('post_id',x.id).eq('user_id',p.id):await sb.from('post_likes').insert({post_id:x.id}))}>${me?'❤️':'🤍'} ${L.length}</button>${x.author_id!==p.id&&html`<button onClick=${async()=>{await sb.from('post_reports').insert({post_id:x.id});alert('রিপোর্ট হয়েছে')}}>রিপোর্ট</button>`}${(adm||x.author_id===p.id)&&html`<button class="text-red-300" onClick=${async()=>confirm('মুছবেন?')&&E(await sb.from('posts').delete().eq('id',x.id))}>মুছুন</button>`}${adm&&html`<button onClick=${async()=>E(await sb.from('posts').update({pinned:!x.pinned}).eq('id',x.id))}>পিন</button>`}</div>
${cm.filter(c=>c.post_id===x.id).map(c=>html`<div key=${c.id} class="text-sm pl-3 border-l border-white/20"><b>${c.author_name}</b>: ${c.body} ${(adm||c.author_id===p.id)&&html`<button class="text-red-300 text-xs" onClick=${async()=>E(await sb.from('post_comments').delete().eq('id',c.id))}>×</button>`}</div>`)}
<div class="flex gap-2"><input placeholder="মন্তব্য" maxlength="500" value=${nm[x.id]||''} onInput=${e=>setNm({...nm,[x.id]:e.target.value})}/><button class="tab g" onClick=${async()=>{const b=(nm[x.id]||'').trim();if(!b)return;setNm({...nm,[x.id]:''});E(await sb.from('post_comments').insert({post_id:x.id,body:b}))}}>↩</button></div></div>`})}</div>`}
function Run({r,done}){const[a,setA]=useState({}),[left,setLeft]=useState(r.secs),[i,setI]=useState(0),[busy,setBusy]=useState(false);
const[qs]=useState(()=>{const x=r.questions.map(q=>({...q,o:q.opts.map((t,k)=>({t,k}))}));if(r.shuffle){x.sort(()=>Math.random()-.5);x.forEach(q=>q.o.sort(()=>Math.random()-.5))}return x});
const fin=async()=>{if(busy)return;setBusy(true);const{data,error}=await sb.rpc('mcq_submit',{sid:r.sub_id,ans:a});if(error){alert(error.message);setBusy(false);return}done(data)};
useEffect(()=>{const t=setInterval(()=>setLeft(x=>x-1),1000);return()=>clearInterval(t)},[]);useEffect(()=>{if(left<=0)fin()},[left]);
const q=qs[i];if(!q)return html`<div class="g p-4">কোনো প্রশ্ন নেই <button class="btn" onClick=${fin}>জমা</button></div>`;
return html`<div class="space-y-3"><div class="g p-3 flex justify-between"><b>প্রশ্ন ${i+1}/${qs.length}</b><b class=${left<60?'text-red-400':'gold'}>⏱ ${Math.floor(Math.max(left,0)/60)}:${String(Math.max(left,0)%60).padStart(2,'0')}</b></div>
<div class="g p-4 space-y-2"><div class="font-semibold">${q.q} <span class="text-xs">(${q.marks})</span></div>${q.o.map(o=>html`<button key=${o.k} class=${'tab w-full text-left '+(a[q.id]===o.k?'on':'g')} onClick=${()=>setA({...a,[q.id]:o.k})}>${o.t}</button>`)}</div>
<div class="flex gap-2"><button class="tab g" disabled=${i===0} onClick=${()=>setI(i-1)}>◀</button><button class="tab g" disabled=${i===qs.length-1} onClick=${()=>setI(i+1)}>▶</button><button class="btn flex-1" disabled=${busy} onClick=${()=>confirm(Object.keys(a).length+'/'+qs.length+' উত্তর দেওয়া হয়েছে। জমা দেবেন?')&&fin()}>জমা দিন</button></div>
<div class="flex gap-1 flex-wrap">${qs.map((x,k)=>html`<button key=${x.id} class=${'w-7 h-7 rounded text-xs '+(a[x.id]!==undefined?'bg-green-600':'bg-white/15')} onClick=${()=>setI(k)}>${k+1}</button>`)}</div></div>`}
function McqStudent({p,kind}){const[ex,setEx]=useState([]),[mine,setMine]=useState([]),[run,setRun]=useState(null),[res,setRes]=useState(null),[bd,setBd]=useState(null);
const load=async()=>{const[e,s]=await Promise.all([sb.from('mcq_exams').select('*').eq('kind',kind==='comp'?'comp':'mcq').order('created_at',{ascending:false}),sb.from('mcq_submissions').select('exam_id,score,total').eq('student_id',p.id).not('submitted_at','is',null)]);setEx(e.data||[]);setMine(s.data||[])};useEffect(()=>{load()},[]);

if(run)return html`<${Run} r=${run} done=${d=>{setRun(null);setRes(d);load()}}/>`;
return html`<div class="space-y-3">${res&&html`<div class="g p-4 text-center"><div class="text-2xl gold font-bold">${res.score}/${res.total}</div>ফলাফল সংরক্ষিত হয়েছে</div>`}
${ex.length===0&&html`<div class="g p-4 text-center">এখনো কিছু নেই</div>`}${ex.map(e=>{const m=mine.filter(x=>x.exam_id===e.id);return html`<div key=${e.id} class="g p-3 space-y-2"><div class="font-semibold">${e.title}</div><div class="text-xs text-blue-200">${e.minutes} মিনিট${e.neg>0?' · নেগেটিভ '+e.neg:''}${m.length?' · আপনার সর্বোচ্চ: '+Math.max(...m.map(x=>x.score))+'/'+m[0].total:''}</div><div class="flex gap-2"><button class="btn flex-1" onClick=${()=>start(e)}>${m.length?'আবার দিন':'শুরু করুন'}</button><button class="tab g" onClick=${()=>board(e)}>র‍্যাংক</button></div></div>`})}
${bd&&html`<div class="g divide-y divide-white/10"><div class="p-3 font-semibold">${bd.e.title} — র‍্যাংকিং</div>${bd.d.map((r,i)=>html`<div key=${r.student_id} class=${'p-3 flex justify-between '+(r.student_id===p.id?'bg-yellow-400/20':'')}><span><b class="gold">${i<3?['🥇','🥈','🥉'][i]:i+1}</b> ${r.name}</span><b>${r.score}/${r.total}</b></div>`)}</div>`}</div>`}
function McqAdmin({kind}){const k=kind==='comp'?'comp':'mcq',[ex,setEx]=useState([]),[f,setF]=useState({title:'',minutes:10,neg:0,retake:false}),[sel,setSel]=useState(null),[nq,setNq]=useState({q:'',o:['','','',''],c:0,m:1}),[cnt,setCnt]=useState(0),[bd,setBd]=useState([]);
const load=async()=>{const{data}=await sb.from('mcq_exams').select('*').eq('kind',k).order('created_at',{ascending:false});setEx(data||[])};useEffect(()=>{load()},[]);

function Login({done}){const[adm,setAdm]=useState(false),[names,setNames]=useState([]),[namesReady,setNamesReady]=useState(false),[namesError,setNamesError]=useState(''),[id,setId]=useState(''),[pin,setPin]=useState(''),[phone,setPhone]=useState(''),[err,setErr]=useState(''),[busy,setBusy]=useState(false);
useEffect(()=>{(async()=>{try{const{data,error}=await sb.rpc('student_names');if(error){setNamesError(error.message);setNames([])}else{setNames(data||[])} }catch(x){setNamesError(x.message)}finally{setNamesReady(true)}})()},[]);
const norm=x=>String(x||'').trim().toLowerCase().replace(/\s+/g,' ');
const find=q=>{const n=norm(q);const m=names.find(x=>norm(x.name)===n);return m?m.student_code:null};
const go=async e=>{e.preventDefault();const q=id.trim();if(!q)return setErr(adm?'ইমেইল লিখুন':'আপনার নাম লিখুন');if(!adm&&!namesReady)return setErr('শিক্ষার্থীদের তালিকা লোড হচ্ছে। কয়েক সেকেন্ড পরে আবার চেষ্টা করুন।');if(!adm&&namesError)return setErr('শিক্ষার্থীদের তালিকা পাওয়া যায়নি: '+namesError+'। Supabase-এর student_names Function পরীক্ষা করতে হবে।');setBusy(true);setErr('');
try{let key=adm?q:find(q);

<h1 class="text-3xl font-bold gold mt-5">OMAR’S PRIVATE BATCH</h1><p class="mt-2 text-blue-200">90 Days Math Challenge ও আরও চ্যালেঞ্জ</p>
<form onSubmit=${go} class="g p-5 mt-6 text-left space-y-3"><div class="font-semibold">${adm?'অ্যাডমিন লগইন':'লগইন'}</div>
<input placeholder=${adm?'অ্যাডমিন ইমেইল':'আপনার নাম লিখুন'} value=${id} onInput=${e=>setId(e.target.value)}/>
<input type="password" placeholder=${adm?'পাসওয়ার্ড':'পিন'} value=${pin} onInput=${e=>setPin(e.target.value)} required/>
${!adm&&html`<input type="tel" inputMode="numeric" placeholder="মোবাইল / WhatsApp নম্বর (প্রথমবার)" value=${phone} onInput=${e=>setPhone(e.target.value)}/><div class="text-xs text-blue-200">প্রথমবার অ্যাকাউন্ট খোলার সময় নম্বর দিন; এই নম্বরে WhatsApp যোগাযোগ করা যাবে।</div>`}
${err&&html`<div class="text-red-400 text-sm break-words">${err}</div>`}
<button class="btn w-full" disabled=${busy||(!adm&&!namesReady)}>${busy?'অপেক্ষা করুন...':(!adm&&!namesReady?'তালিকা লোড হচ্ছে...':'প্রবেশ করুন')}</button>
${!adm&&html`<div class="text-xs text-blue-200 text-center">প্রথমবার নাম ও পিন দিলেই আপনার অ্যাকাউন্ট খুলে যাবে</div>`}
<button type="button" class="text-xs underline text-blue-200 w-full" onClick=${()=>{setAdm(!adm);setId('');setErr('')}}>${adm?'শিক্ষার্থী লগইন':'অ্যাডমিন লগইন'}</button></form></div>`}
function Admin(){const[tab,setTab]=useState('ch'),[chs,setChs]=useState([]),[arch,setArch]=useState([]),[st,setSt]=useState([]),[open,setOpen]=useState(null),[f,setF]=useState({name:'',all:true});
const loadS=async()=>{const{data}=await sb.from('profiles').select('*').eq('role','student').order('created_at');setSt(data||[])};
const loadC=async()=>{const{data,error}=await sb.from('challenges').select('*').eq('is_deleted',false).order('created_at');if(error){alert('চ্যালেঞ্জ লোড হয়নি: '+error.message);return}setChs(data||[])};
const loadArch=async()=>{const{data,error}=await sb.from('challenges').select('*').eq('is_deleted',true).order('created_at',{ascending:false});if(error){alert('আর্কাইভ লোড হয়নি: '+error.message);return}setArch(data||[])};
useEffect(()=>{loadS();loadC();loadArch()},[]);
const archiveChallenge=async c=>{if(!confirm('“'+c.name+'” চ্যালেঞ্জটি আর্কাইভ করবেন? হাজিরা, পরীক্ষার নম্বর ও অন্যান্য রেকর্ড মুছবে না। পরে ফিরিয়ে আনা যাবে।'))return;const{error}=await sb.from('challenges').update({is_deleted:true}).eq('id',c.id);if(error){alert('আর্কাইভ করা যায়নি: '+error.message);return}await loadC();await loadArch();alert('চ্যালেঞ্জটি আর্কাইভ হয়েছে। পুরোনো রেকর্ড নিরাপদ আছে।')};
const renameChallenge=async c=>{const n=prompt('চ্যালেঞ্জের নতুন নাম লিখুন',c.name);if(n===null||!n.trim())return;const{error}=await sb.from('challenges').update({name:n.trim()}).eq('id',c.id);if(error)return alert('নাম পরিবর্তন হয়নি: '+error.message);await loadC();alert('চ্যালেঞ্জের নাম পরিবর্তন হয়েছে ✓')};
const restoreChallenge=async c=>{if(!confirm('“'+c.name+'” চ্যালেঞ্জটি আবার চালু করবেন?'))return;const{error}=await sb.from('challenges').update({is_deleted:false}).eq('id',c.id);if(error){alert('ফিরিয়ে আনা যায়নি: '+error.message);return}await loadC();await loadArch();alert('চ্যালেঞ্জটি ফিরিয়ে আনা হয়েছে ✓')};
const deleteChallenge=async c=>{if(!confirm('“'+c.name+'” চ্যালেঞ্জ এবং এর সব হাজিরা ও পরীক্ষার নম্বর চিরতরে মুছে যাবে। এটা ফেরানো যাবে না। মুছবেন?'))return;if(!confirm('শেষবার নিশ্চিত করুন: সত্যিই মুছে ফেলবেন?'))return;const{error}=await sb.from('challenges').delete().eq('id',c.id);if(error)return alert('মোছা যায়নি: '+error.message);loadC();loadArch()};
const create=async()=>{const name=f.name.trim();if(!name)return alert('চ্যালেঞ্জের নাম লিখুন');try{const{error}=await sb.from('challenges').insert({name,all_students:f.all});if(error){alert('চ্যালেঞ্জ তৈরি হয়নি: '+error.message);return}setF({name:'',all:true});await loadC();alert('চ্যালেঞ্জ সফলভাবে তৈরি হয়েছে ✓')}catch(e){alert('চ্যালেঞ্জ তৈরি করতে সমস্যা হয়েছে: '+(e?.message||e))}};
if(open)return html`<div><button class="underline text-sm mb-3" onClick=${()=>setOpen(null)}>← সব চ্যালেঞ্জ</button><${Chal} ch=${open} st=${st}/></div>`;
const T=(k,l)=>html`<button class=${'tab '+(tab===k?'on':'g')} onClick=${()=>setTab(k)}>${l}</button>`;
return html`<div><div class="flex gap-2 mb-4 flex-wrap">${T('ch','চ্যালেঞ্জ')}${T('arch','আর্কাইভ')}${T('stu','শিক্ষার্থী')}</div>
${tab==='ch'&&html`<div class="space-y-3"><div class="g p-3 space-y-2"><div class="font-semibold">নতুন চ্যালেঞ্জ</div>
<input placeholder="চ্যালেঞ্জের নাম" value=${f.name} onInput=${e=>setF({...f,name:e.target.value})}/>
<label class="flex items-center gap-2"><input type="checkbox" class="!w-5 !h-5 accent-yellow-400" checked=${f.all} onChange=${e=>setF({...f,all:e.target.checked})}/>সব শিক্ষার্থীর জন্য</label>
<button class="btn w-full" onClick=${create}>চ্যালেঞ্জ তৈরি করুন</button></div>
${chs.map(c=>html`<div key=${c.id} class="g p-3 flex items-center gap-2 flex-wrap"><button onClick=${()=>setOpen(c)} class="flex-1 text-left font-semibold gold min-w-0">${c.name}<div class="text-xs text-blue-200 font-normal">${c.all_students?'সব শিক্ষার্থী':'বাছাই করা শিক্ষার্থী'}</div></button><button class="text-blue-200 border border-blue-300/40 rounded-lg px-3 py-2 text-sm" onClick=${()=>renameChallenge(c)}>নাম এডিট</button><button class="text-red-300 border border-red-400/40 rounded-lg px-3 py-2 text-sm" onClick=${()=>archiveChallenge(c)}>আর্কাইভ</button><button class="text-red-300 border border-red-400/40 rounded-lg px-3 py-2 text-sm" onClick=${()=>deleteChallenge(c)}>মুছুন</button></div>`)}</div>`}
${tab==='arch'&&html`<div class="space-y-3"><div class="text-sm text-blue-200">এখানকার চ্যালেঞ্জগুলো শিক্ষার্থীদের তালিকায় দেখা যায় না। পুরোনো হাজিরা ও পরীক্ষার তথ্য অক্ষত আছে।</div>${arch.length===0&&html`<div class="g p-4 text-center">আর্কাইভে কোনো চ্যালেঞ্জ নেই</div>`}${arch.map(c=>html`<div key=${c.id} class="g p-3 flex items-center gap-2"><div class="flex-1 font-semibold gold">${c.name}</div><button class="btn text-sm" onClick=${()=>restoreChallenge(c)}>ফিরিয়ে আনুন</button><button class="text-red-300 border border-red-400/40 rounded-lg px-3 py-2 text-sm" onClick=${()=>deleteChallenge(c)}>চিরতরে মুছুন</button></div>`)}</div>`}
${tab==='stu'&&html`<${Students} st=${st} reload=${loadS}/>`}</div>`}

function Chal({ch,st}){const[tab,setTab]=useState('att'),[dl,setDl]=useState([]),[date,setDate]=useState(today()),[pres,setPres]=useState(new Set()),[days,setDays]=useState(0),[ex,setEx]=useState([]),[lb,setLb]=useState([]),[mem,setMem]=useState(new Set());
const loadA=async()=>{const{data}=await sb.from('attendance').select('student_id').eq('day',date).eq('challenge_id',ch.id);setPres(new Set((data||[]).map(r=>r.student_id)))};
const loadM=async()=>{const{data:d}=await sb.rpc('class_days',{cid:ch.id});setDays((d||[]).length);setDl((d||[]).map(r=>String(r.day).slice(0,10)));
const{data:e}=await sb.from('exams').select('*').eq('challenge_id',ch.id).order('exam_date',{ascending:false});setEx(e||[]);
const{data:l}=await sb.rpc('leaderboard',{cid:ch.id});setLb(l||[])};

<div class="flex gap-3 text-xs mt-2"><span>🟩 ক্লাস হয়েছে</span><span>🟥 অনুপস্থিত</span><span>⬜ আসছে</span></div></div>
<div class="g p-4"><div class="font-semibold mb-2">ক্লাসের তারিখ</div>${d.c.length===0&&html`<div class="text-sm">এখনো কোনো ক্লাস হয়নি</div>`}${d.c.slice().reverse().map(x=>html`<div key=${x} class="flex justify-between text-sm py-1"><span>${fmtS(x)}</span><b class=${d.a.has(x)?'text-green-400':'text-red-400'}>${d.a.has(x)?'✓ উপস্থিত':'✗ অনুপস্থিত'}</b></div>`)}</div>
<div class="g p-4"><div class="font-semibold mb-2">পরীক্ষার নম্বর</div>${d.m.length===0&&html`<div class="text-sm">এখনো কোনো পরীক্ষা নেই</div>`}
${d.m.map((r,i)=>html`<div key=${i} class="flex justify-between text-sm py-1"><span>${r.exams.name}</span><b>${r.marks}/${r.exams.total}</b></div>`)}</div>
<${AllMarks} k=${d.k} lb=${d.l}/><${Board} lb=${d.l} me=${p.id}/></div>`}

function AllMarks({k,lb}){const ex=[...new Map(k.map(r=>[r.exam_id,r])).values()].sort((a,b)=>a.exam_date<b.exam_date?-1:1);
if(!ex.length)return null;const names=lb.map(r=>r.name);const get=(n,e)=>{const r=k.find(x=>x.name===n&&x.exam_id===e);return r?r.marks:'-'};
return html`<div class="g p-4"><div class="font-semibold mb-2">সবার পরীক্ষার নম্বর</div><div class="overflow-x-auto"><table class="text-sm w-full"><thead><tr><th class="text-left pr-3">নাম</th>${ex.map(e=>html`<th key=${e.exam_id} class="px-2 whitespace-nowrap">${e.exam_name}<div class="text-[10px] font-normal">/${e.total}</div></th>`)}</tr></thead>
<tbody>${names.map(n=>html`<tr key=${n} class="border-t border-white/10"><td class="pr-3 py-1 whitespace-nowrap">${n}</td>${ex.map(e=>html`<td key=${e.exam_id} class="text-center">${get(n,e.exam_id)}</td>`)}</tr>`)}</tbody></table></div></div>`}

function Student({p}){const[chs,setChs]=useState(null),[open,setOpen]=useState(null);
useEffect(()=>{(async()=>{const[c,m]=await Promise.all([sb.from('challenges').select('*').eq('is_deleted',false).order('created_at'),sb.from('challenge_members').select('challenge_id').eq('student_id',p.id)]);
const ids=new Set((m.data||[]).map(r=>r.challenge_id));const mine=(c.data||[]).filter(x=>x.all_students||ids.has(x.id));setChs(mine);if(mine.length===1)setOpen(mine[0])})()},[]);
if(!chs)return html`<div class="text-center p-8">লোড হচ্ছে...</div>`;
if(open)return html`<div>${chs.length>1&&html`<button class="underline text-sm mb-3" onClick=${()=>setOpen(null)}>← সব চ্যালেঞ্জ</button>`}<${SChal} p=${p} ch=${open}/></div>`;
return html`<div class="space-y-3 fade"><div class="font-semibold">আপনার চ্যালেঞ্জ</div>${chs.length===0&&html`<div class="g p-4 text-center">আপনাকে এখনো কোনো চ্যালেঞ্জে যুক্ত করা হয়নি</div>`}
${chs.map(c=>html`<button key=${c.id} onClick=${()=>setOpen(c)} class="g p-4 w-full text-left font-semibold gold">${c.name}</button>`)}</div>`}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister())).catch(()=>{});
</script></body></html>
