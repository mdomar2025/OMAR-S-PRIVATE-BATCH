<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnostic</title>
<style>body{font-family:system-ui,sans-serif;background:#050a1a;color:#fff;margin:0;padding:16px}
h1{font-size:18px;color:#f5c542}button{background:#f5c542;color:#0a1330;font-weight:700;border:0;border-radius:10px;padding:12px 16px;margin:6px 6px 6px 0;font-size:15px}
pre{white-space:pre-wrap;word-break:break-word;background:#0b1226;border:1px solid #334;border-radius:10px;padding:12px;font-size:13px;line-height:1.5}</style></head>
<body><h1>OMAR'S BATCH — সুপারভাইজার চেক</h1>
<button id="run">আবার চেক করুন</button><button id="copy">রিপোর্ট কপি</button><button id="fix">ক্যাশ ও SW মুছুন</button>
<pre id="out">চলছে...</pre>
<iframe id="fr" style="width:1px;height:1px;border:0;position:absolute;left:-9999px"></iframe>
<script>
const SB_URL='https://hxkfuatjenittwhgobzy.supabase.co',SB_KEY='sb_publishable_wo9hBOl3sszigds9Y_0wUw_GKznymVw';
const out=document.getElementById('out');let L=[];
const log=(s)=>{L.push(s);out.textContent=L.join('\n')};
const T=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout '+ms+'ms')),ms))]);
async function head(u){try{const r=await T(fetch(u,{cache:'no-store'}),10000);const t=await r.text();return (r.ok?'OK ':'FAIL ')+r.status+' ('+t.length+' bytes)'+(/Login – Vercel|vercel.com\/login/i.test(t)?' ⚠ Vercel login page!':'')}catch(e){return 'ERROR '+e.message}}
function loadScript(u){return new Promise(res=>{const s=document.createElement('script');const t=setTimeout(()=>res('TIMEOUT'),12000);s.onload=()=>{clearTimeout(t);res('OK')};s.onerror=()=>{clearTimeout(t);res('BLOCKED/FAILED')};s.src=u;document.head.appendChild(s)})}
async function run(){L=[];log('সময়: '+new Date().toISOString());log('URL: '+location.href);log('Browser: '+navigator.userAgent.slice(0,90));log('Online: '+navigator.onLine);
log('\n[1] সাইট ফাইল');
for(const f of ['index.html','plus.js','plus2.js','manifest.json','sw.js'])log(f+' → '+await head(f+'?d='+Date.now()));
log('\n[2] CDN স্ক্রিপ্ট');
const cdn={tailwind:'https://cdn.tailwindcss.com/3.4.17',react:'https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js','react-dom':'https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js',htm:'https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js',supabase:'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js'};
for(const k in cdn)log(k+' → '+await loadScript(cdn[k]));
log('\n[3] Supabase');
log('auth health → '+await (async()=>{try{const r=await T(fetch(SB_URL+'/auth/v1/health',{headers:{apikey:SB_KEY}}),10000);return r.status+' '+(await r.text()).slice(0,120)}catch(e){return 'ERROR '+e.message}})());
log('rpc student_names → '+await (async()=>{try{const r=await T(fetch(SB_URL+'/rest/v1/rpc/student_names',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:'{}'}),10000);return r.status+' '+(await r.text()).slice(0,200)}catch(e){return 'ERROR '+e.message}})());
log('\n[4] Service Worker / ক্যাশ');
try{const rs=await navigator.serviceWorker.getRegistrations();log('SW registered: '+rs.length);const ks=await caches.keys();log('Caches: '+(ks.join(', ')||'none'))}catch(e){log('ERROR '+e.message)}
log('\n[5] আসল অ্যাপ লোড টেস্ট (৬ সেকেন্ড)');
await new Promise(res=>{const fr=document.getElementById('fr');fr.onload=()=>setTimeout(()=>{try{const w=fr.contentWindow;log('React: '+typeof w.React+' | supabase: '+typeof w.supabase+' | htm: '+typeof w.htm);const r=w.document.getElementById('root');log('root children: '+(r?r.children.length:'no root'));log('root text: '+(r?r.textContent.slice(0,80):''))}catch(e){log('ERROR '+e.message)}res()},6000);fr.src='index.html?d='+Date.now()});
log('\n✔ শেষ। "রিপোর্ট কপি" চেপে চ্যাটে পেস্ট করুন।')}
document.getElementById('run').onclick=run;
document.getElementById('copy').onclick=()=>{navigator.clipboard.writeText(out.textContent).then(()=>alert('কপি হয়েছে'),()=>alert('কপি হয়নি, লেখা সিলেক্ট করে কপি করুন'))};
document.getElementById('fix').onclick=async()=>{try{for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();for(const k of await caches.keys())await caches.delete(k);alert('মুছে গেছে। এবার মূল সাইট খুলুন।')}catch(e){alert(e.message)}};
run();
</script></body></html>
